name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run build
      - name: Validate Docker Compose files
        run: |
          cp .env.example .env
          docker compose -f compose.dev.yaml config --quiet
          docker compose -f compose.prod.yaml config --quiet
      - run: docker build --target production .
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Prepare deployment package
        run: |
          mkdir -p deploy_staging/dist deploy_staging/database deploy_staging/tmp
          cp -r dist/. deploy_staging/dist/
          cp -r database/. deploy_staging/database/
          cp package.json package-lock.json deploy_staging/
          date > deploy_staging/tmp/restart.txt
      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.O2SWITCH_FTP_SERVER }}
          username: ${{ secrets.O2SWITCH_FTP_USERNAME }}
          password: ${{ secrets.O2SWITCH_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./deploy_staging/
          server-dir: ${{ secrets.O2SWITCH_FTP_SERVER_DIR }}/
          dangerous-clean-slate: false
